<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coach menu bar item states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 440px; height: 360px; box-sizing: border-box; background: #0c1115; color: #e3e9ee; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px; line-height: 1.4; padding: 20px; display: flex; flex-direction: column; gap: 16px">

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 12px; color: #b0bbc5">Default: today's spend</div>
    <div style="height: 28px; background: #19212a; border: 1px solid #2c3843; border-radius: 6px; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 12px">
      <div style="display: flex; align-items: center; gap: 6px">
        <svg aria-hidden="true" width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="#e3e9ee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,11 5,7 8,9 15,2"></polyline></svg>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500">$27.80</span>
      </div>
      <span style="font-size: 12px; color: #b0bbc5">Mon Nov 23 11:41</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 12px; color: #b0bbc5">A session is running: a dot beside the mark</div>
    <div style="height: 28px; background: #19212a; border: 1px solid #2c3843; border-radius: 6px; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 12px">
      <div style="display: flex; align-items: center; gap: 6px">
        <svg aria-hidden="true" width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="#e3e9ee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,11 5,7 8,9 15,2"></polyline></svg>
        <span style="width: 6px; height: 6px; border-radius: 999px; background: #6cc693"></span>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500">$27.80</span>
      </div>
      <span style="font-size: 12px; color: #b0bbc5">Mon Nov 23 11:41</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 12px; color: #b0bbc5">A limit passes 90%: the limit shows beside the spend</div>
    <div style="height: 28px; background: #19212a; border: 1px solid #2c3843; border-radius: 6px; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 12px">
      <div style="display: flex; align-items: center; gap: 6px">
        <svg aria-hidden="true" width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="#f08b81" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,11 5,7 8,9 15,2"></polyline></svg>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500">$27.80</span>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500; color: #f08b81">Weekly 94%</span>
      </div>
      <span style="font-size: 12px; color: #b0bbc5">Mon Nov 23 11:41</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 12px; color: #b0bbc5">Compact: the mark alone</div>
    <div style="height: 28px; background: #19212a; border: 1px solid #2c3843; border-radius: 6px; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 12px">
      <svg aria-hidden="true" width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="#e3e9ee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,11 5,7 8,9 15,2"></polyline></svg>
      <span style="font-size: 12px; color: #b0bbc5">Mon Nov 23 11:41</span>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":360}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
